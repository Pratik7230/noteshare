<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- White Background -->
  <rect x="0" y="0" width="500" height="500" fill="#ffffff" />

  <!-- Document Base -->
  <path d="M120 70 h180 l100 100 v240 a20 20 0 0 1 -20 20 h-260 a20 20 0 0 1 -20 -20 v-320 a20 20 0 0 1 20 -20 z" fill="#00D2FF" />
  
  <!-- Document Fold -->
  <path d="M300 70 v80 a20 20 0 0 0 20 20 h80 z" fill="#007BFF" />

  <!-- Note Lines -->
  <rect x="160" y="170" width="120" height="16" rx="8" fill="#ffffff" />
  <rect x="160" y="220" width="160" height="16" rx="8" fill="#ffffff" />
  <rect x="160" y="270" width="100" height="16" rx="8" fill="#ffffff" />

  <!-- Share Network Icon Connections -->
  <line x1="330" y1="280" x2="410" y2="220" stroke="#1E1E2F" stroke-width="16" stroke-linecap="round" />
  <line x1="330" y1="280" x2="410" y2="340" stroke="#1E1E2F" stroke-width="16" stroke-linecap="round" />

  <!-- Share Network Nodes -->
  <circle cx="330" cy="280" r="30" fill="#1E1E2F" />
  <circle cx="410" cy="220" r="22" fill="#1E1E2F" />
  <circle cx="410" cy="340" r="22" fill="#1E1E2F" />
  
  <!-- Inner Dots for Nodes -->
  <circle cx="330" cy="280" r="12" fill="#00D2FF" />
  <circle cx="410" cy="220" r="8" fill="#ffffff" />
  <circle cx="410" cy="340" r="8" fill="#ffffff" />

  <!-- NoteShare Typography -->
  <text x="250" y="470" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1E1E2F" text-anchor="middle">NoteShare</text>
</svg>