<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 60 380 380" width="500" height="500" fill="none">
  <style>
    .share-node { fill: #1E1E2F; }
    .share-line { stroke: #1E1E2F; }
    .node-dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .share-node { fill: #ffffff; }
      .share-line { stroke: #ffffff; }
      .node-dot { fill: #007BFF; }
    }
  </style>

  <!-- Document Base -->
  <path d="M120 70 h180 l100 100 v240 a20 20 0 0 1 -20 20 h-260 a20 20 0 0 1 -20 -20 v-320 a20 20 0 0 1 20 -20 z" fill="#00D2FF" />
  
  <!-- Document Fold -->
  <path d="M300 70 v80 a20 20 0 0 0 20 20 h80 z" fill="#007BFF" />

  <!-- Note Lines -->
  <rect x="160" y="170" width="120" height="16" rx="8" fill="#ffffff" />
  <rect x="160" y="220" width="160" height="16" rx="8" fill="#ffffff" />
  <rect x="160" y="270" width="100" height="16" rx="8" fill="#ffffff" />

  <!-- Share Network Icon Connections -->
  <line x1="330" y1="280" x2="410" y2="220" class="share-line" stroke-width="16" stroke-linecap="round" />
  <line x1="330" y1="280" x2="410" y2="340" class="share-line" stroke-width="16" stroke-linecap="round" />

  <!-- Share Network Nodes -->
  <circle cx="330" cy="280" r="30" class="share-node" />
  <circle cx="410" cy="220" r="22" class="share-node" />
  <circle cx="410" cy="340" r="22" class="share-node" />
  
  <!-- Inner Dots for Nodes -->
  <circle cx="330" cy="280" r="12" fill="#00D2FF" />
  <circle cx="410" cy="220" r="8" class="node-dot" />
  <circle cx="410" cy="340" r="8" class="node-dot" />
</svg>
